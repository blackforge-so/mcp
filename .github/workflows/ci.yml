name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22: blackforge_formula_watch (and its tests) use the built-in WebSocket.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The integration suite drives the BUILT server over stdio, so build before test.
      - run: npm run build
      - run: npm test
      # The built package, so a release can be smoke-tested against production and
      # staged for npm from exactly what CI built.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14
